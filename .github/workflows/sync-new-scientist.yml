name: Sync New Scientist Mental Health

on:
  schedule:
    # Fallback: runs daily at 14:00 UTC in case the dispatch event is missed
    - cron: '0 14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [new-scientist-digest-complete]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and transform NS Mental Health data
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          url = "https://raw.githubusercontent.com/Meggers1982/new-scientist-story-ideas/main/data/results.json"
          try:
              with urllib.request.urlopen(url) as resp:
                  source = json.loads(resp.read())
          except Exception as e:
              print(f"Fetch failed: {e}")
              raise

          if isinstance(source, list):
              source = {"last_updated": "", "total_studies": len(source), "studies": source}

          for study in source.get("studies", []):
              if "ns_score" in study and "relevance_score" not in study:
                  study["relevance_score"] = study.pop("ns_score")
              if "ns_score_reason" in study and "relevance_score_reason" not in study:
                  study["relevance_score_reason"] = study.pop("ns_score_reason")
              if "ns_pitch" in study and "pitch_angles" not in study:
                  ns = study.pop("ns_pitch")
                  study["pitch_angles"] = [ns] if ns and isinstance(ns, dict) else []

          _ANIMAL_TAGS = ("animal only", "animal or cell study", "rodent model only")
          source["studies"] = [
              s for s in source.get("studies", [])
              if not any(tag in s.get("caveats", "").lower() for tag in _ANIMAL_TAGS)
          ]

          source["source_id"] = "new-scientist-mh"
          source["source_label"] = "New Scientist — Mental Health"
          source["total_studies"] = len(source.get("studies", []))

          Path("data/new-scientist-mh.json").write_text(json.dumps(source, indent=2) + "\n")
          print(f"Wrote {source['total_studies']} studies")
          PY

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/new-scientist-mh.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync New Scientist Mental Health digest"
            git pull --rebase origin main && git push
          fi

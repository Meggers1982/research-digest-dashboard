<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Digest Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1d2522;
    --muted: #66706c;
    --line: #dde3df;
    --paper: #ffffff;
    --wash: #f6f3ed;
    --green: #173f35;
    --green-2: #e5f4ee;
    --blue: #245a92;
    --gold: #a56a14;
    --red: #b42318;
  }
  body {
    min-height: 100vh;
    background: var(--wash);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.55;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--green);
    color: #fff;
    padding: 20px 28px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.22);
  }
  .header-row {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.2;
  }
  .meta {
    margin-top: 3px;
    font: 0.8rem/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: rgba(255,255,255,0.72);
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 4px 11px;
    border-radius: 999px;
    background: rgba(255,255,255,0.13);
    font: 0.75rem/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    white-space: nowrap;
  }
  .chip.highlight { background: #2563eb; }
  .chip.new { background: #16864f; }
  .filters {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
  }
  .filters-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(220px, 1.3fr) repeat(6, minmax(135px, auto));
    gap: 10px;
    align-items: center;
  }
  .filter-actions {
    max-width: 1180px;
    margin: 8px auto 0;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .db-banner {
    max-width: 1180px;
    margin: 10px auto 0;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
    padding: 12px 16px;
    font: 0.83rem system-ui, -apple-system, sans-serif;
    color: #5a4000;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .db-banner.connected {
    background: #f0faf5;
    border-color: #c7eadb;
    color: #145233;
  }
  .db-banner p { flex: 1; min-width: 200px; margin: 0; line-height: 1.5; }
  .db-form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    flex: 2;
    min-width: 280px;
  }
  .db-form input {
    flex: 1;
    min-width: 160px;
    min-height: 32px;
    padding: 5px 9px;
    font-size: 0.8rem;
    border: 1px solid #ffe082;
    border-radius: 5px;
    background: #fff;
    color: var(--ink);
    width: auto;
  }
  .db-form button, .db-btn {
    min-height: 32px;
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 0.8rem;
    cursor: pointer;
    border: 1px solid #cfd8d3;
    background: #fff;
    color: var(--ink);
  }
  .db-btn-primary {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }
  .db-btn-primary:hover { background: #0f2e26; }
  input, select, button {
    min-height: 36px;
    border: 1px solid #cfd8d3;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font: 0.85rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  input, select { padding: 7px 10px; width: 100%; }
  button { padding: 7px 13px; cursor: pointer; }
  button:hover { background: #f2f5f3; }
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .result-count {
    color: var(--muted);
    font: 0.84rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .source-status {
    color: var(--muted);
    font: 0.78rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid #d2d9d5;
    border-radius: 8px;
    overflow: hidden;
  }
  .card.status-saved { border-left-color: var(--gold); }
  .card.status-pitched { border-left-color: #16864f; }
  .card.status-passed { border-left-color: #9aa3a0; }
  .card-header { padding: 18px 20px 10px; }
  .headline {
    color: var(--green);
    font-size: 1.08rem;
    font-weight: 700;
    line-height: 1.38;
    margin-bottom: 9px;
  }
  .card-meta {
    display: flex;
    gap: 7px;
    align-items: center;
    flex-wrap: wrap;
    color: var(--muted);
    font: 0.74rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    max-width: 100%;
    padding: 2px 8px;
    border-radius: 999px;
    font: 700 0.68rem/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }
  .badge-source { background: #dbeafe; color: #1e3a8a; }
  .badge-cat { background: var(--green-2); color: #14543e; }
  .badge-gb { background: #fff1c7; color: #794600; }
  .badge-media { background: #dcfce7; color: #166534; }
  .score {
    border: 1px solid #cfd8d3;
    background: #f7faf8;
    color: #30413a;
  }
  .score.high { background: #dcfce7; color: #14532d; border-color: #86efac; }
  .score.mid { background: #fef9c3; color: #713f12; border-color: #fde047; }
  .card-body {
    padding: 0 20px 14px;
    font-size: 0.93rem;
  }
  .card-body p { margin: 9px 0; }
  .card-body strong { color: #0e1714; }
  .note {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    background: #f7f8f7;
    color: #59645f;
    font: 0.8rem/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .fact { background: #fff7df; color: #60420f; border-left: 3px solid #e7a92f; }
  .pitch-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 0;
    border-top: 1px solid #c7eadb;
    border-radius: 0;
    background: #effaf5;
    color: #176044;
    padding: 10px 20px;
    text-align: left;
    font-weight: 700;
  }
  .pitch-toggle:hover { background: #e1f5ec; }
  .arrow { display: inline-block; width: 16px; transition: transform 0.18s; }
  .pitch-toggle.open .arrow { transform: rotate(90deg); }
  .pitch-body {
    display: none;
    background: #effaf5;
    border-top: 1px solid #c7eadb;
    padding: 14px 20px 18px;
  }
  .pitch-body.open { display: block; }
  .pitch {
    background: #fff;
    border: 1px solid #c7eadb;
    border-radius: 8px;
    padding: 13px 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .pitch:last-child { margin-bottom: 0; }
  .pitch-type {
    color: #16864f;
    margin-bottom: 6px;
    font: 800 0.7rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-transform: uppercase;
  }
  .pitch-field { margin-top: 8px; }
  .pitch-field label {
    display: block;
    margin-bottom: 2px;
    color: #66706c;
    font: 800 0.68rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-transform: uppercase;
  }
  .pitch-field p { margin: 0; font-size: 0.9rem; }
  .pitch-headline { font-weight: 700; color: var(--green); }
  .copy-btn {
    float: right;
    min-height: 26px;
    padding: 3px 9px;
    border: 1px solid #c7eadb;
    border-radius: 5px;
    background: #fff;
    color: #176044;
    font: 0.72rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    cursor: pointer;
  }
  .copy-btn:hover { background: #e1f5ec; }
  .copy-btn.copied { background: #dcfce7; color: #14532d; border-color: #86efac; }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 11px 20px 14px;
    border-top: 1px solid #eef1ef;
  }
  .status-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-btn {
    min-height: 30px;
    padding: 5px 10px;
    border-radius: 999px;
    color: #4d5954;
    font-size: 0.75rem;
  }
  .status-btn.active-new { background: #e8ecea; border-color: #b8c2bd; }
  .status-btn.active-saved { background: #fff1c7; border-color: #f5c56b; color: #794600; }
  .status-btn.active-pitched { background: #dcfce7; border-color: #86efac; color: #166534; }
  .links {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .links a {
    color: var(--blue);
    text-decoration: none;
    font: 0.8rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .links a:hover { text-decoration: underline; }
  .delete-btn {
    min-height: 28px;
    border: 0;
    color: #9aa3a0;
    background: transparent;
    padding: 4px 8px;
    font-size: 0.78rem;
  }
  .delete-btn:hover { background: #fee4e2; color: var(--red); border-radius: 4px; }
  #undo-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1d2522;
    color: #fff;
    padding: 12px 16px 15px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
    font: 0.85rem/1.3 system-ui, -apple-system, sans-serif;
    box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    transition: transform 0.22s cubic-bezier(0.34,1.26,0.64,1);
    z-index: 200;
    overflow: hidden;
    min-width: 280px;
    max-width: 500px;
  }
  #undo-toast.visible { transform: translateX(-50%) translateY(0); }
  #undo-toast .toast-text { flex: 1; }
  #undo-toast .toast-undo {
    min-height: 28px;
    padding: 4px 13px;
    border-radius: 5px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.22);
    font: 0.82rem system-ui, sans-serif;
    cursor: pointer;
    white-space: nowrap;
  }
  #undo-toast .toast-undo:hover { background: rgba(255,255,255,0.26); }
  .toast-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: rgba(255,255,255,0.35);
    animation: toast-drain 6s linear forwards;
  }
  @keyframes toast-drain { from { width: 100%; } to { width: 0%; } }
  .empty, #loading {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
    font: 0.92rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .empty h2, #loading h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: #39453f;
  }
  @media (max-width: 980px) {
    .filters-inner { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filters-inner input { grid-column: 1 / -1; }
  }
  @media (max-width: 620px) {
    header, .filters { padding-left: 16px; padding-right: 16px; }
    .filters-inner { grid-template-columns: 1fr; }
    main { padding-left: 12px; padding-right: 12px; }
    .card-header, .card-body, .card-footer, .pitch-toggle, .pitch-body { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1>Research Digest Dashboard</h1>
      <div class="meta" id="last-updated">Loading sources...</div>
    </div>
    <div class="chips" id="stats-chips"></div>
  </div>
</header>

<section class="filters">
  <div class="filters-inner">
    <input type="search" id="search" placeholder="Search studies, journals, pitches" oninput="applyFilters()">
    <select id="filter-source" onchange="applyFilters()">
      <option value="">All digests</option>
    </select>
    <select id="filter-category" onchange="applyFilters()">
      <option value="">All categories</option>
    </select>
    <select id="filter-groundbreaking" onchange="applyFilters()">
      <option value="">All types</option>
      <option value="counterintuitive">Counterintuitive</option>
      <option value="overturns">Overturns prior research</option>
      <option value="first-in-class">First-in-class</option>
      <option value="major public health">Major public health implication</option>
      <option value="clear fitness">Clear fitness implication</option>
      <option value="relevant">Relevant finding</option>
    </select>
    <select id="filter-status" onchange="applyFilters()">
      <option value="">All statuses</option>
      <option value="new">New</option>
      <option value="saved">Saved</option>
      <option value="pitched">Pitched</option>
    </select>
    <select id="filter-days" onchange="applyFilters()">
      <option value="0">All time</option>
      <option value="7" selected>Past 7 days</option>
      <option value="14">Past 14 days</option>
      <option value="30">Past 30 days</option>
    </select>
    <select id="sort-by" onchange="applyFilters()">
      <option value="score" selected>Sort: relevance score</option>
      <option value="date">Sort: newest first</option>
      <option value="source">Sort: digest</option>
    </select>
    <button type="button" onclick="clearFilters()">Clear</button>
  </div>
  <div class="filter-actions">
    <button type="button" onclick="exportStatus()" title="Download your saved/pitched/passed labels as a JSON backup">Export backup</button>
    <label style="display:inline-flex;align-items:center;">
      <button type="button" onclick="document.getElementById('import-file').click()" title="Restore from a previous backup file">Import backup</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importStatus(event)">
    </label>
  </div>
  <div id="db-banner" class="db-banner" style="display:none"></div>
</section>

<main>
  <div class="summary-row">
    <div class="result-count" id="result-count" style="display:none"></div>
    <div class="source-status" id="source-status"></div>
  </div>
  <div id="undo-toast">
  <span class="toast-text"></span>
  <button class="toast-undo" onclick="undoDelete()">Undo</button>
  <div class="toast-bar"></div>
</div>
<div id="loading">Loading studies...</div>
  <div class="grid" id="cards"></div>
</main>

<script>
const STATUS_KEY = "research-digest-dashboard-status";
const CONFIG_KEY = "research-digest-db-config";

let SOURCES = [];
let ALL_STUDIES = [];
let SOURCE_ERRORS = [];
let TOTAL_NEW_THIS_RUN = 0;
let STATUSES_CACHE = {};
let DB_READY = false;
let pendingDelete = null;

// ── Supabase config ──────────────────────────────────────────────────────────

function getDbConfig() {
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || "null"); }
  catch { return null; }
}

function saveDbConfig(url, key) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify({ url: url.replace(/\/$/, ""), key }));
}

function clearDbConfig() {
  localStorage.removeItem(CONFIG_KEY);
  DB_READY = false;
  renderDbBanner();
}

async function dbRequest(method, path, body) {
  const config = getDbConfig();
  if (!config) return null;
  const headers = {
    "apikey": config.key,
    "Authorization": "Bearer " + config.key,
    "Content-Type": "application/json"
  };
  if (method === "POST") headers["Prefer"] = "resolution=merge-duplicates,return=minimal";
  try {
    const res = await fetch(config.url + "/rest/v1/" + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) {
      console.warn("DB error", res.status, await res.text());
      return null;
    }
    return method === "GET" ? res.json() : true;
  } catch (err) {
    console.warn("DB fetch failed", err);
    return null;
  }
}

async function loadStatuses() {
  const rows = await dbRequest("GET", "study_status?select=study_id,status");
  if (rows === null) return false;
  STATUSES_CACHE = {};
  for (const row of rows) STATUSES_CACHE[row.study_id] = row.status;
  return true;
}

async function persistStatus(id, status) {
  const ok = await dbRequest("POST", "study_status", {
    study_id: id, status, updated_at: new Date().toISOString()
  });
  if (!ok) {
    // Fallback: write to localStorage
    const local = getLocalStatuses();
    local[id] = status;
    localStorage.setItem(STATUS_KEY, JSON.stringify(local));
  }
}

async function connectDb(url, key) {
  saveDbConfig(url, key);
  const rows = await dbRequest("GET", "study_status?select=study_id,status");
  if (rows === null) {
    clearDbConfig();
    return false;
  }
  // Migrate any existing localStorage statuses on first connect
  const local = getLocalStatuses();
  const toMigrate = Object.entries(local).filter(([, v]) => v !== "new");
  if (toMigrate.length > 0) {
    await dbRequest("POST", "study_status", toMigrate.map(([study_id, status]) => ({
      study_id, status, updated_at: new Date().toISOString()
    })));
    for (const [id, status] of toMigrate) rows.push({ study_id: id, status });
  }
  STATUSES_CACHE = {};
  for (const row of rows) STATUSES_CACHE[row.study_id] = row.status;
  DB_READY = true;
  return true;
}

// ── Status persistence ───────────────────────────────────────────────────────

function getLocalStatuses() {
  try { return JSON.parse(localStorage.getItem(STATUS_KEY) || "{}"); }
  catch { return {}; }
}

function statusId(study) {
  return [study.source_id || "source", study.pmid || study.headline || ""].join(":");
}

function getStatus(study) {
  const id = statusId(study);
  return STATUSES_CACHE[id] || (DB_READY ? "new" : (getLocalStatuses()[id] || study.status || "new"));
}

function setStatus(id, status) {
  STATUSES_CACHE[id] = status;
  persistStatus(id, status);
  applyFilters();
  renderStats();
}

function deleteStudy(id) {
  // Commit any previously pending delete before starting a new one
  if (pendingDelete) commitDelete();

  const idx = ALL_STUDIES.findIndex(s => statusId(s) === id);
  if (idx === -1) return;
  const study = ALL_STUDIES[idx];

  // Remove from view immediately (optimistic)
  STATUSES_CACHE[id] = "deleted";
  ALL_STUDIES.splice(idx, 1);
  applyFilters();
  renderStats();

  // Show undo toast — actual DB write is deferred until the timer fires
  pendingDelete = { id, study, idx, timer: setTimeout(commitDelete, 6000) };
  showUndoToast(study.headline || study.title || "Study");
}

function undoDelete() {
  if (!pendingDelete) return;
  clearTimeout(pendingDelete.timer);
  const { id, study, idx } = pendingDelete;
  pendingDelete = null;
  delete STATUSES_CACHE[id];
  // Restore study at its original position
  ALL_STUDIES.splice(idx, 0, study);
  applyFilters();
  renderStats();
  hideUndoToast();
}

function commitDelete() {
  if (!pendingDelete) return;
  clearTimeout(pendingDelete.timer);
  const { id } = pendingDelete;
  pendingDelete = null;
  persistStatus(id, "deleted");
  hideUndoToast();
}

function showUndoToast(headline) {
  const toast = document.getElementById("undo-toast");
  const label = headline.length > 60 ? headline.slice(0, 60) + "…" : headline;
  toast.querySelector(".toast-text").textContent = "“" + label + "” deleted";
  // Restart the drain animation
  const bar = toast.querySelector(".toast-bar");
  bar.style.animation = "none";
  bar.offsetHeight;
  bar.style.animation = "";
  toast.classList.add("visible");
}

function hideUndoToast() {
  document.getElementById("undo-toast").classList.remove("visible");
}

// ── DB banner UI ─────────────────────────────────────────────────────────────

function renderDbBanner() {
  const banner = document.getElementById("db-banner");
  const config = getDbConfig();

  if (DB_READY) {
    banner.className = "db-banner connected";
    banner.style.display = "";
    banner.innerHTML = `
      <p>&#10003; Database connected &mdash; statuses sync across devices.</p>
      <button class="db-btn" onclick="clearDbConfig()">Disconnect</button>`;
    return;
  }

  banner.className = "db-banner";
  banner.style.display = "";
  banner.innerHTML = `
    <p><strong>Connect a database</strong> to sync saved/pitched/passed labels across devices.
    Create a free <a href="https://supabase.com" target="_blank" rel="noreferrer">Supabase</a> project,
    run the SQL below, then paste your Project URL and anon key.</p>
    <details style="flex:1;min-width:260px">
      <summary style="cursor:pointer;font-weight:700;margin-bottom:6px">Setup SQL (click to expand)</summary>
      <pre style="background:#fff;border:1px solid #ffe082;border-radius:5px;padding:10px;font-size:0.75rem;overflow:auto;white-space:pre-wrap">create table study_status (
  study_id  text primary key,
  status    text not null,
  updated_at timestamptz default now()
);
alter table study_status enable row level security;
create policy "personal use" on study_status
  for all to anon using (true) with check (true);</pre>
    </details>
    <div class="db-form">
      <input type="url" id="db-url" placeholder="https://xxxx.supabase.co" autocomplete="off">
      <input type="password" id="db-key" placeholder="anon key" autocomplete="off">
      <button class="db-btn db-btn-primary" onclick="handleDbConnect()">Connect</button>
      <button class="db-btn" onclick="document.getElementById('db-banner').style.display='none'">Skip</button>
    </div>`;
}

async function handleDbConnect() {
  const url = document.getElementById("db-url").value.trim();
  const key = document.getElementById("db-key").value.trim();
  if (!url || !key) { alert("Please enter both the project URL and anon key."); return; }
  const btn = document.querySelector(".db-btn-primary");
  btn.textContent = "Connecting...";
  btn.disabled = true;
  const ok = await connectDb(url, key);
  if (ok) {
    DB_READY = true;
    renderDbBanner();
    applyFilters();
    renderStats();
  } else {
    btn.textContent = "Connect";
    btn.disabled = false;
    alert("Could not connect. Check that the URL and key are correct and the study_status table exists.");
  }
}

// ── Data loading ─────────────────────────────────────────────────────────────

async function fetchJson(path) {
  const res = await fetch(path + "?ts=" + Date.now());
  if (!res.ok) throw new Error(path + " returned " + res.status);
  return res.json();
}

async function init() {
  // Load DB statuses first so we can exclude deleted studies on load
  const config = getDbConfig();
  if (config) {
    const ok = await loadStatuses();
    DB_READY = ok;
  } else {
    // Seed cache from localStorage so getStatus() works before DB is set up
    STATUSES_CACHE = getLocalStatuses();
  }

  renderDbBanner();

  try {
    SOURCES = await fetchJson("data/sources.json");
    populateSourceFilter(SOURCES);

    const payloads = await Promise.all(SOURCES.map(async source => {
      try {
        const payload = await fetchJson(source.file);
        return { source, payload };
      } catch {
        SOURCE_ERRORS.push(source.label);
        return { source, payload: { studies: [] } };
      }
    }));

    TOTAL_NEW_THIS_RUN = payloads.reduce((sum, { payload }) =>
      sum + (Number(payload.new_this_run) || 0), 0);

    ALL_STUDIES = dedupeStudies(payloads.flatMap(({ source, payload }) => {
      const studies = (Array.isArray(payload) ? payload : (payload.studies || []))
        .filter(s => !s.excluded);
      const sourceId = payload.source_id || source.id;
      const sourceLabel = payload.source_label || source.label;
      return studies.map(study => ({
        ...study,
        source_id: study.source_id || sourceId,
        source_label: study.source_label || sourceLabel
      }));
    })).filter(study => STATUSES_CACHE[statusId(study)] !== "deleted");

    populateCategoryFilter(ALL_STUDIES);
    renderStats();
    applyFilters();
    renderSourceStatus();
    document.getElementById("loading").style.display = "none";
  } catch {
    document.getElementById("loading").innerHTML =
      "<h2>Dashboard data is not ready</h2><p>Check data/sources.json and the digest JSON files.</p>";
  }
}

function dedupeStudies(studies) {
  const byKey = new Map();
  for (const study of studies) {
    // Priority: PMID → DOI → headline+journal+pubdate (no source_id, so cross-digest dupes are caught)
    const key = study.pmid || study.doi || [study.headline, study.journal, study.pubdate].join("|");
    const existing = byKey.get(key);
    if (!existing) {
      byKey.set(key, { ...study, _source_labels: [study.source_label] });
    } else {
      // Merge source labels so the card shows all digests it appeared in
      const labels = existing._source_labels;
      if (!labels.includes(study.source_label)) labels.push(study.source_label);
      if (isFresherOrBetter(study, existing)) {
        byKey.set(key, { ...study, _source_labels: labels });
      }
    }
  }
  return Array.from(byKey.values());
}

function isFresherOrBetter(a, b) {
  const scoreA = Number(a.relevance_score || 0);
  const scoreB = Number(b.relevance_score || 0);
  if (scoreA !== scoreB) return scoreA > scoreB;
  return String(a.run_date || a.pubdate || "") > String(b.run_date || b.pubdate || "");
}

// ── Filter dropdowns ─────────────────────────────────────────────────────────

function populateSourceFilter(sources) {
  const select = document.getElementById("filter-source");
  select.innerHTML = '<option value="">All digests</option>' +
    sources.map(s => `<option value="${escAttr(s.id)}">${esc(s.label)}</option>`).join("");
}

function populateCategoryFilter(studies) {
  const categories = Array.from(new Set(studies.map(s => s.category).filter(Boolean))).sort();
  const select = document.getElementById("filter-category");
  select.innerHTML = '<option value="">All categories</option>' +
    categories.map(c => `<option value="${escAttr(c)}">${esc(c)}</option>`).join("");
}

// ── Stats header ─────────────────────────────────────────────────────────────

function renderSourceStatus() {
  const loaded = SOURCES.length - SOURCE_ERRORS.length;
  const note = SOURCE_ERRORS.length
    ? "Loaded " + loaded + " of " + SOURCES.length + " digests; missing: " + SOURCE_ERRORS.join(", ")
    : "Loaded " + loaded + " digests";
  document.getElementById("source-status").textContent = note;
}

function renderStats() {
  const saved = ALL_STUDIES.filter(s => getStatus(s) === "saved").length;
  const pitched = ALL_STUDIES.filter(s => getStatus(s) === "pitched").length;
  const chips = [
    { label: ALL_STUDIES.length + " studies", cls: "highlight" },
    { label: saved + " saved", cls: "" },
    { label: pitched + " pitched", cls: "" },
    { label: SOURCES.length + " digests", cls: "" }
  ];
  if (TOTAL_NEW_THIS_RUN > 0) chips.splice(1, 0, { label: TOTAL_NEW_THIS_RUN + " new this run", cls: "new" });
  document.getElementById("stats-chips").innerHTML =
    chips.map(c => `<span class="chip ${c.cls}">${esc(c.label)}</span>`).join("");

  const latest = latestDate(ALL_STUDIES);
  document.getElementById("last-updated").textContent = latest
    ? "Latest study run: " + latest.toLocaleString()
    : "Waiting for digest results";
}

function latestDate(studies) {
  const dates = studies
    .map(s => new Date(s.run_date || s.pubdate || ""))
    .filter(d => !Number.isNaN(d.getTime()));
  if (!dates.length) return null;
  return new Date(Math.max(...dates.map(d => d.getTime())));
}

// ── Filtering & sorting ──────────────────────────────────────────────────────

function applyFilters() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const source = document.getElementById("filter-source").value;
  const category = document.getElementById("filter-category").value;
  const type = document.getElementById("filter-groundbreaking").value.toLowerCase();
  const statusFilter = document.getElementById("filter-status").value;
  const days = Number(document.getElementById("filter-days").value);
  const sortBy = document.getElementById("sort-by").value;
  const cutoff = days > 0 ? new Date(Date.now() - days * 86400000) : null;

  let filtered = ALL_STUDIES.filter(study => {
    const status = getStatus(study);
    if (source && study.source_id !== source) return false;
    if (category && study.category !== category) return false;
    if (statusFilter && status !== statusFilter) return false;
    if (type && !String(study.groundbreaking || "").toLowerCase().includes(type)) return false;
    if (cutoff) {
      const d = new Date(study.run_date || study.pubdate || "");
      if (!Number.isNaN(d.getTime()) && d < cutoff) return false;
    }
    if (query && !searchText(study).includes(query)) return false;
    return true;
  });

  if (sortBy === "score") {
    filtered.sort((a, b) => Number(b.relevance_score || 0) - Number(a.relevance_score || 0));
  } else if (sortBy === "date") {
    filtered.sort((a, b) => String(b.run_date || b.pubdate || "").localeCompare(String(a.run_date || a.pubdate || "")));
  } else {
    filtered.sort((a, b) => String(a.source_label || "").localeCompare(String(b.source_label || "")));
  }

  document.getElementById("result-count").style.display = "block";
  document.getElementById("result-count").textContent =
    filtered.length + " of " + ALL_STUDIES.length + " studies";

  document.getElementById("cards").innerHTML = filtered.length
    ? filtered.map(renderCard).join("")
    : '<div class="empty"><h2>No studies match your filters</h2><p>Try broadening the filters or search.</p></div>';
}

function searchText(study) {
  const pitches = (study.pitch_angles || [])
    .map(p => [p.publication_type, p.headline, p.hook, p.why_it_fits, p.pitch_angle, p.caveats_to_flag].join(" "))
    .join(" ");
  return [study.source_label, study.category, study.headline, study.summary,
    study.why_it_matters, study.caveats, study.journal, pitches].join(" ").toLowerCase();
}

function clearFilters() {
  document.getElementById("search").value = "";
  document.getElementById("filter-source").value = "";
  document.getElementById("filter-category").value = "";
  document.getElementById("filter-groundbreaking").value = "";
  document.getElementById("filter-status").value = "";
  document.getElementById("filter-days").value = "7";
  document.getElementById("sort-by").value = "score";
  applyFilters();
}

// ── Card rendering ───────────────────────────────────────────────────────────

function renderCard(study) {
  const id = statusId(study);
  const status = getStatus(study);
  const pitchAngles = Array.isArray(study.pitch_angles) ? study.pitch_angles : [];
  const statusButtons = ["new", "saved", "pitched"].map(name =>
    `<button class="status-btn${status === name ? " active-" + name : ""}" onclick="setStatus('${escAttr(id)}','${name}')">${titleCase(name)}</button>`
  ).join("");
  const pitches = pitchAngles.map((p, i) => renderPitch(p, id, i)).join("");
  const fact = study.fact_check_note
    ? `<div class="note fact"><strong>Fact-check note:</strong> ${esc(study.fact_check_note)}</div>` : "";
  const caveats = study.caveats && study.caveats !== "None identified"
    ? `<div class="note">${esc(study.caveats)}</div>` : "";
  const mediaCoverage = study.media_coverage &&
    !String(study.media_coverage).startsWith("Not verified") &&
    !String(study.media_coverage).toLowerCase().includes("unavailable");

  return `
<article class="card status-${escAttr(status)}">
  <div class="card-header">
    <div class="headline">${esc(study.headline || study.title || "Untitled study")}</div>
    <div class="card-meta">
      ${scoreBadge(study)}
      ${(study._source_labels || [study.source_label || "Digest"]).map(l => `<span class="badge badge-source">${esc(l)}</span>`).join("")}
      ${study.category ? `<span class="badge badge-cat">${esc(study.category)}</span>` : ""}
      ${study.groundbreaking ? `<span class="badge badge-gb">${esc(study.groundbreaking)}</span>` : ""}
      ${mediaCoverage ? '<span class="badge badge-media">Media coverage found</span>' : ""}
      ${study.journal ? `<span>${esc(study.journal)}</span>` : ""}
      ${study.pubdate ? `<span>${esc(study.pubdate)}</span>` : ""}
      ${study.run_date ? `<span>Found ${esc(study.run_date)}</span>` : ""}
    </div>
  </div>
  <div class="card-body">
    ${study.summary ? `<p><strong>The study:</strong> ${esc(study.summary)}</p>` : ""}
    ${study.why_it_matters ? `<p><strong>Why it matters:</strong> ${esc(study.why_it_matters)}</p>` : ""}
    ${caveats}${fact}
  </div>
  ${pitchAngles.length ? `
    <button class="pitch-toggle" onclick="togglePitch(this)" data-target="pitch-${escAttr(id)}">
      <span class="arrow">&gt;</span> Pitch angles (${pitchAngles.length})
    </button>
    <div class="pitch-body" id="pitch-${escAttr(id)}">${pitches}</div>` : ""}
  <div class="card-footer">
    <div class="status-buttons">${statusButtons}</div>
    <div class="links">
      ${study.pmid ? `<a href="https://pubmed.ncbi.nlm.nih.gov/${escAttr(study.pmid)}/" target="_blank" rel="noreferrer">PubMed ${esc(study.pmid)}</a>` : ""}
      ${study.doi ? `<a href="https://doi.org/${escAttr(study.doi)}" target="_blank" rel="noreferrer">DOI</a>` : ""}
      <button class="delete-btn" title="Delete — hides permanently" onclick="deleteStudy('${escAttr(id)}')">Delete</button>
    </div>
  </div>
</article>`;
}

function renderPitch(pitch, studyId, index) {
  const copyId = "copy-" + escAttr(studyId) + "-" + index;
  return `
<div class="pitch">
  <button class="copy-btn" id="${copyId}" onclick="copyPitch('${copyId}', ${index}, '${escAttr(studyId)}')">Copy</button>
  ${pitch.publication_type ? `<div class="pitch-type">${esc(pitch.publication_type)}</div>` : ""}
  ${pitch.headline ? `<div class="pitch-field"><label>Headline</label><p class="pitch-headline">${esc(pitch.headline)}</p></div>` : ""}
  ${pitch.hook ? `<div class="pitch-field"><label>Opening hook</label><p>${esc(pitch.hook)}</p></div>` : ""}
  ${pitch.why_it_fits ? `<div class="pitch-field"><label>Why it fits</label><p>${esc(pitch.why_it_fits)}</p></div>` : ""}
  ${pitch.pitch_angle ? `<div class="pitch-field"><label>Pitch angle</label><p>${esc(pitch.pitch_angle)}</p></div>` : ""}
  ${pitch.caveats_to_flag ? `<div class="pitch-field"><label>Caveats to flag</label><p>${esc(pitch.caveats_to_flag)}</p></div>` : ""}
</div>`;
}

function copyPitch(btnId, index, studyId) {
  const study = ALL_STUDIES.find(s => statusId(s) === studyId);
  if (!study) return;
  const pitch = (study.pitch_angles || [])[index];
  if (!pitch) return;
  const parts = [
    pitch.publication_type ? "FOR: " + pitch.publication_type : "",
    pitch.headline        ? "HEADLINE: " + pitch.headline : "",
    pitch.hook            ? "HOOK: " + pitch.hook : "",
    pitch.pitch_angle     ? "PITCH: " + pitch.pitch_angle : "",
    pitch.why_it_fits     ? "WHY IT FITS: " + pitch.why_it_fits : "",
    pitch.caveats_to_flag ? "CAVEATS: " + pitch.caveats_to_flag : ""
  ].filter(Boolean).join("\n\n");
  navigator.clipboard.writeText(parts).then(() => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 2000);
  });
}

function scoreBadge(study) {
  const score = Number(study.relevance_score);
  if (Number.isNaN(score)) return "";
  const cls = score >= 8 ? " high" : score >= 6 ? " mid" : "";
  const reason = study.relevance_score_reason ? ` title="${escAttr(study.relevance_score_reason)}"` : "";
  return `<span class="badge score${cls}"${reason}>Relevance ${score}/10</span>`;
}

// ── Export / Import backup ───────────────────────────────────────────────────

function exportStatus() {
  const data = DB_READY ? STATUSES_CACHE : getLocalStatuses();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "digest-status-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

function importStatus(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const imported = JSON.parse(e.target.result);
      let count = 0;
      for (const [id, status] of Object.entries(imported)) {
        if (STATUSES_CACHE[id] !== status) {
          STATUSES_CACHE[id] = status;
          await persistStatus(id, status);
          count++;
        }
      }
      // Remove deleted studies from ALL_STUDIES
      for (const [id, status] of Object.entries(imported)) {
        if (status === "deleted") {
          const idx = ALL_STUDIES.findIndex(s => statusId(s) === id);
          if (idx !== -1) ALL_STUDIES.splice(idx, 1);
        }
      }
      applyFilters();
      renderStats();
      alert("Imported " + count + " status labels.");
    } catch {
      alert("Could not parse the selected file. Make sure it is a valid backup export.");
    }
    event.target.value = "";
  };
  reader.readAsText(file);
}

// ── Utilities ────────────────────────────────────────────────────────────────

function togglePitch(button) {
  button.classList.toggle("open");
  const target = document.getElementById(button.dataset.target);
  if (target) target.classList.toggle("open");
}

function titleCase(value) {
  return value.charAt(0).toUpperCase() + value.slice(1);
}

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function escAttr(value) {
  return esc(value).replace(/'/g, "&#39;");
}

init();
</script>
